<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Daemons</title>
    <style>
        /* Reset and Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #16213e;
            width: 1000px;
            max-width: 98vw;
            max-height: 95vh;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 20px 28px;
            border-bottom: 1px solid #2a2a4a;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            color: #8888aa;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-link {
            color: #3a7bd5;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #5a9be5;
        }

        .separator {
            color: #4a4a6a;
        }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            gap: 0;
            padding: 0 28px;
            border-bottom: 1px solid #2a2a4a;
            flex-shrink: 0;
        }

        .tab {
            padding: 12px 20px 10px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
            color: #6a6a8a;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #c0c0e0;
            background: #1a2a4a;
        }

        .tab.active {
            color: #3a7bd5;
            border-bottom-color: #3a7bd5;
        }

        /* Search Bar */
        .search-bar {
            padding: 16px 28px;
            flex-shrink: 0;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px;
            background-color: #16213e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }

        .search-bar input:focus {
            border-color: #3a7bd5;
            box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.15);
        }

        /* Filter Bar */
        .filter-bar {
            padding: 0 28px 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #8888aa;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #3a7bd5;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 13px;
            color: #6a6a8a;
            font-weight: 500;
        }

        .pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pill {
            padding: 4px 14px;
            border: 1px solid #2a2a4a;
            border-radius: 20px;
            background: #16213e;
            font-size: 12px;
            color: #8888aa;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .pill:hover {
            background: #1a3a5c;
            border-color: #3a7bd5;
            color: #c0c0e0;
        }

        .pill.active {
            background: #3a7bd5;
            border-color: #3a7bd5;
            color: white;
        }

        .pill.active:hover {
            background: #5a9be5;
            border-color: #5a9be5;
        }

        /* Table */
        .service-table-wrapper {
            flex: 1;
            overflow: auto;
            padding: 0 28px 4px;
        }

        .service-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .service-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .service-table th {
            text-align: left;
            padding: 10px 12px;
            background: #16213e;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8888aa;
            border-bottom: 2px solid #2a2a4a;
        }

        .service-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #1e1e3a;
            vertical-align: middle;
        }

        .service-table tbody tr:hover {
            background: #1a2a4a;
        }

        .col-name {
            width: 25%;
        }

        .col-display {
            width: 35%;
        }

        .col-type {
            width: 20%;
        }

        .col-status {
            width: 20%;
        }

        .svc-name {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            color: #c0c0e0;
        }

        .svc-display {
            color: #a0a0c0;
        }

        .svc-type {
            font-size: 12px;
            color: #7a7a9a;
        }

        .svc-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-running {
            background: #22c55e;
        }

        .status-stopped {
            background: #ef4444;
        }

        .status-other {
            background: #f59e0b;
        }

        .loading-text {
            text-align: center;
            padding: 40px 0;
            color: #5a5a7a;
            font-style: italic;
        }

        /* Footer */
        footer {
            padding: 12px 28px;
            border-top: 1px solid #2a2a4a;
            flex-shrink: 0;
        }

        .status-text {
            font-size: 13px;
            color: #6a6a8a;
        }

        /* Scrollbar Styling */
        .service-table-wrapper::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .service-table-wrapper::-webkit-scrollbar-track {
            background: #1e1e3a;
            border-radius: 3px;
        }

        .service-table-wrapper::-webkit-scrollbar-thumb {
            background: #3a3a5a;
            border-radius: 3px;
        }

        .service-table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #4a4a6a;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                max-width: 100vw;
                max-height: 100vh;
                border-radius: 0;
            }

            header {
                padding: 16px 16px;
            }

            .tab-bar {
                padding: 0 16px;
                overflow-x: auto;
            }

            .search-bar {
                padding: 12px 16px;
            }

            .filter-bar {
                padding: 0 16px 12px;
                gap: 12px;
            }

            .service-table-wrapper {
                padding: 0 12px 4px;
            }

            .service-table th,
            .service-table td {
                padding: 8px 8px;
                font-size: 13px;
            }

            .col-name {
                width: 30%;
            }
            .col-display {
                width: 30%;
            }
            .col-type {
                width: 20%;
            }
            .col-status {
                width: 20%;
            }

            footer {
                padding: 10px 16px;
            }
        }

        @media (max-width: 480px) {
            .filter-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .col-display {
                display: none;
            }

            .service-table th:nth-child(2),
            .service-table td:nth-child(2) {
                display: none;
            }

            .col-name {
                width: 40%;
            }
            .col-type {
                width: 25%;
            }
            .col-status {
                width: 35%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="breadcrumb">
                <a href="home.html" class="back-link">&#x2190; Wintools</a>
                <span class="separator">/</span>
                <span>Manage Daemons</span>
            </div>
        </header>

        <div class="tab-bar">
            <button class="tab active" data-tab="running" id="tab-running">Running</button>
            <button class="tab" data-tab="stopped" id="tab-stopped">Stopped</button>
        </div>

        <div class="search-bar">
            <input type="text" id="search" placeholder="Search services..." autocomplete="off">
        </div>

        <div class="filter-bar">
            <label class="checkbox-label">
                <input type="checkbox" id="name-only"> Name only
            </label>

            <div class="filter-group">
                <span class="filter-label">Type:</span>
                <div id="type-filters" class="pills"></div>
            </div>
        </div>

        <div class="service-table-wrapper">
            <table class="service-table">
                <thead>
                    <tr>
                        <th class="col-name">Name</th>
                        <th class="col-display">Display Name</th>
                        <th class="col-type">Type</th>
                        <th class="col-status">Status</th>
                    </tr>
                </thead>
                <tbody id="service-list">
                    <tr>
                        <td colspan="4" class="loading-text">Loading services...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <footer>
            <span class="status-text" id="status-bar">Loading...</span>
        </footer>
    </div>

    <script>
        let allServices = [];
        let activeType = "All";
        let activeTab = "running";

        async function loadServices(tab) {
            activeTab = tab || "running";

            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.getElementById("tab-" + activeTab).classList.add("active");

            document.getElementById("search").value = "";
            activeType = "All";

            // Show loading state
            const tbody = document.getElementById("service-list");
            tbody.innerHTML = '<tr><td colspan="4" class="loading-text">Loading services...</td></tr>';

            try {
                if (activeTab === "running") {
                    allServices = await window.pywebview.api.get_running_services();
                } else {
                    allServices = await window.pywebview.api.get_stopped_services();
                }

                buildTypeFilters(allServices);
                renderTable(allServices);
                updateStatusBar(allServices.length, allServices.length);
            } catch (error) {
                console.error("Failed to load services:", error);
                tbody.innerHTML = '<tr><td colspan="4" class="loading-text">Failed to load services. Please try again.</td></tr>';
                document.getElementById("status-bar").textContent = "Error loading services";
            }
        }

        function buildTypeFilters(services) {
            const types = [...new Set(services.map(s => s.service_type))].sort();
            const container = document.getElementById("type-filters");
            container.innerHTML = "";

            const allBtn = createPill("All", true);
            container.appendChild(allBtn);

            for (const type of types) {
                container.appendChild(createPill(type, false));
            }
        }

        function createPill(label, isActive) {
            const btn = document.createElement("button");
            btn.className = "pill" + (isActive ? " active" : "");
            btn.textContent = label;
            btn.addEventListener("click", function () {
                activeType = label;
                document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
                btn.classList.add("active");
                applyFilters();
            });
            return btn;
        }

        function renderTable(services) {
            const tbody = document.getElementById("service-list");
            tbody.innerHTML = "";

            if (!services || services.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="loading-text">No services found</td></tr>';
                return;
            }

            for (const svc of services) {
                const tr = document.createElement("tr");
                tr.dataset.name = svc.name.toLowerCase();
                tr.dataset.display = svc.display_name.toLowerCase();
                tr.dataset.type = svc.service_type;

                const statusClass =
                    svc.status === "Running" ? "status-running" :
                    svc.status === "Stopped" ? "status-stopped" : "status-other";

                tr.innerHTML =
                    '<td class="svc-name">' + escapeHtml(svc.name) + '</td>' +
                    '<td class="svc-display">' + escapeHtml(svc.display_name) + '</td>' +
                    '<td class="svc-type">' + escapeHtml(svc.service_type) + '</td>' +
                    '<td class="svc-status"><span class="status-dot ' + statusClass + '"></span> ' + escapeHtml(svc.status) + '</td>';

                tbody.appendChild(tr);
            }
        }

        function applyFilters() {
            const query = document.getElementById("search").value.toLowerCase();
            const nameOnly = document.getElementById("name-only").checked;
            const rows = document.querySelectorAll("#service-list tr");
            let visible = 0;

            // Skip the "No services found" or loading row
            for (const row of rows) {
                if (row.querySelector(".loading-text")) {
                    continue;
                }

                const matchesSearch = nameOnly
                    ? row.dataset.name.includes(query)
                    : row.dataset.name.includes(query) || row.dataset.display.includes(query);

                const matchesType = activeType === "All" || row.dataset.type === activeType;

                const show = matchesSearch && matchesType;
                row.style.display = show ? "" : "none";
                if (show) visible++;
            }

            // Count total rows (excluding loading/empty message)
            const totalRows = rows.length - (document.querySelector(".loading-text") ? 1 : 0);
            updateStatusBar(visible, allServices.length);
        }

        function updateStatusBar(visible, total) {
            const bar = document.getElementById("status-bar");
            if (visible === total) {
                bar.textContent = total + " services";
            } else {
                bar.textContent = "Showing " + visible + " of " + total + " services";
            }
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById("tab-running").addEventListener("click", function () {
            loadServices("running");
        });

        document.getElementById("tab-stopped").addEventListener("click", function () {
            loadServices("stopped");
        });

        document.getElementById("search").addEventListener("input", applyFilters);
        document.getElementById("name-only").addEventListener("change", applyFilters);

        // Initialize on page load
        window.addEventListener("pywebviewready", function () {
            loadServices("running");
        });

        // Fallback if pywebviewready doesn't fire
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof window.pywebview !== 'undefined') {
                loadServices("running");
            }
        });
    </script>
</body>
</html>
