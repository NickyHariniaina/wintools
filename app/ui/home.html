<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wintools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Wintools</h1>
        </header>

        <main>
            <button class="tool-btn active">
                <span class="tool-icon">&#x1F5A5;&#xFE0F;</span>
                <span class="tool-name">Manage Daemons</span>
                <span class="tool-badge active-badge">&#x2192;</span>
            </button>

            <button class="tool-btn disabled">
                <span class="tool-icon">&#x1F4C1;</span>
                <span class="tool-name">File Manager</span>
                <span class="tool-badge soon-badge">soon</span>
            </button>

            <button class="tool-btn disabled">
                <span class="tool-icon">&#x2699;&#xFE0F;</span>
                <span class="tool-name">System Info</span>
                <span class="tool-badge soon-badge">soon</span>
            </button>

            <button class="tool-btn disabled">
                <span class="tool-icon">&#x1F4CA;</span>
                <span class="tool-name">Process Monitor</span>
                <span class="tool-badge soon-badge">soon</span>
            </button>
        </main>

        <footer>
            <span class="status-text">Status: Ready</span>
            <span class="tray-indicator">&#x25CF;</span>
        </footer>
    </div>
</body>
</html>
